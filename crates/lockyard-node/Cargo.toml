[package]
name = "lockyard-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Authenticated persistent transports and execution protocol for Lockyard nodes."

[dependencies]
aho-corasick = "1.1.4"
lockyard-cloud-client.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
libc.workspace = true
ureq.workspace = true
ring = "0.17"
tokio.workspace = true
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
url = "2"
base64 = "0.22"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-native-certs = "0.8"
rcgen = { version = "0.14", features = ["ring"] }
hpke = { version = "=0.15.1", default-features = false, features = ["alloc", "nistp", "aes"] }
p256 = { version = "0.14", default-features = false, features = ["pkcs8", "arithmetic", "std"] }
rand_chacha = "0.10"
rand_core = "0.10"
x509-parser = { version = "0.18", default-features = false }
zeroize = "1"

[dev-dependencies]
tempfile.workspace = true
