[workspace]
members = ["crates/lockyard", "crates/lockyard-core", "crates/lockyard-cloud-client"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lockyard-dev/lockyard"
homepage = "https://lockyard.dev"
description = "Coordination for coding agents: a shared bus, work zones and tasks."

[workspace.dependencies]
lockyard-core = { path = "crates/lockyard-core", version = "0.1.0" }
lockyard-cloud-client = { path = "crates/lockyard-cloud-client", version = "0.1.0" }
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
tempfile = "3"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
