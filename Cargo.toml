[workspace]
members = ["crates/lockyard", "crates/lockyard-core", "crates/lockyard-cloud-client", "crates/lockyard-node", "crates/lockyard-compat"]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lockyard-dev/lockyard"
homepage = "https://lockyard.dev"
description = "Coordination for coding agents: a shared bus, work zones and tasks."

[workspace.dependencies]
lockyard-compat = { path = "crates/lockyard-compat", version = "0.2.2" }
lockyard-core = { path = "crates/lockyard-core", version = "0.2.2" }
lockyard-cloud-client = { path = "crates/lockyard-cloud-client", version = "0.2.2" }
lockyard-node = { path = "crates/lockyard-node", version = "0.2.2" }
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
# Only the file-system backends: no debouncer, no async runtime, no serde of events.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
rusqlite = { version = "0.41", features = ["bundled", "functions", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
tempfile = "3"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
