name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable action
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
        if: runner.os != 'Windows'
      - run: cargo test --locked --workspace
        if: runner.os == 'Linux'
      - name: Test every macOS crate except the two release performance budgets
        if: runner.os == 'macOS'
        run: cargo test --locked --workspace -- --exact --skip hook_decision_p95_stays_within_budget --skip msg_send_p95_stays_within_budget
      - name: Enforce unchanged performance budgets on the macOS release binary
        if: runner.os == 'macOS'
        run: |
          sh tests/macos-perf-gate.test.sh
          sh tools/ci/test-macos-perf.sh
      - name: Check every Windows-supported crate
        if: runner.os == 'Windows'
        run: cargo clippy --locked --workspace --exclude lockyard-node --all-targets -- -D warnings
      - name: Test every Windows-supported crate
        if: runner.os == 'Windows'
        run: cargo test --locked --workspace --exclude lockyard-node -- --skip hook_decision_p95_stays_within_budget --skip msg_send_p95_stays_within_budget
      - name: Enforce unchanged performance budgets on the Windows release binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/ci/test-windows-perf.ps1
      - name: Require E2EE from the actual MCP subprocess
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo build --locked -p lockyard
          python3 tools/ci/required-e2ee-mcp.py --binary target/debug/lockyard

  ep12-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r scripts/requirements-ep12.txt
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/ep12-architecture.py --repo .
      - name: Install the production duplicate scanner dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Reject EP-12 production duplicates
        shell: bash
        run: |
          set -euo pipefail
          scan="$(mktemp)"; trap 'rm -f "$scan"' EXIT
          python3 scripts/ep12-production-scan.py --repo . --out "$scan"
          if rg -n '\b(task_number|parse_task_id|item_id|registry_id|task_id_for|compact_tools|full_tools|COMPOSITES|LegacyTaskIdV1|OwnerDecisionV1Reader|LegacySessionHeaderV1|LegacyWireShapeV1|BindSessionTokenAsync|BindSessionTokenCoreAsync)\b|X-Registry-Session' "$scan"; then exit 1; else result=$?; test "$result" -eq 1; fi

  crate-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Require a version bump for changed crate code
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-${PUSH_BASE:-}}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          sh scripts/check-versions.sh --changed "$base"
      - run: sh tests/check-versions-changes.test.sh

  # Licenses, advisories and banned crates. A new dependency that fails this is refused.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable action
        with:
          toolchain: 1.99.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  # Hook decision p95 ≤ 15 ms and msg send p95 ≤ 20 ms, no network.
  perf-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable action
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
      - run: cargo test -p lockyard --test perf_budget -- --nocapture

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable action
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
      - run: cargo build --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast -- --skip hook_decision_p95_stays_within_budget --skip msg_send_p95_stays_within_budget
      - name: Enforce unchanged performance budgets on the Windows release binary
        shell: pwsh
        run: ./tools/ci/test-windows-perf.ps1
      - name: Two sessions arbitrate one claim over a real named pipe
        shell: pwsh
        run: |
          $test = 'agent::daemon::tests::windows_two_sessions_one_claim_named_pipe'
          $catalog = cargo test --locked -p lockyard --bin lockyard -- --list
          if ($LASTEXITCODE -ne 0 -or -not ($catalog -match "^${test}: test$")) { throw 'Windows named-pipe e2e is missing' }
          cargo test --locked -p lockyard --bin lockyard $test -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: ./target/debug/lockyard.exe about

  node-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable action
        with:
          toolchain: 1.99.1
          components: clippy
      - run: cargo build --locked -p lockyard -p lockyard-node --bin lockyard --bin lockyard-sandbox
      - name: Provision an immutable rootfs and precise AppArmor attachments
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap debian-archive-keyring apparmor-utils slirp4netns
          sudo sh tools/ci/prepare-native-rootfs.sh /var/lib/lockyard-ci-rootfs
          # Hosted /usr/local and /opt paths can be writable by the runner.
          # Preserve the installer's root-owned ancestor requirement with a private system path.
          sudo install -d -o root -g root -m 755 /usr/lib/lockyard-ci /usr/lib/lockyard-ci/bin
          sudo install -o root -g root -m 755 target/debug/lockyard /usr/lib/lockyard-ci/bin/lockyard
          sudo install -o root -g root -m 755 target/debug/lockyard-sandbox /usr/lib/lockyard-ci/bin/lockyard-sandbox
          sudo /usr/lib/lockyard-ci/bin/lockyard node install --apparmor \
            --sandbox-binary /usr/lib/lockyard-ci/bin/lockyard-sandbox
      - name: Verify native enforcement or an explicit executor refusal
        shell: bash
        env:
          LOCKYARD_NATIVE_ROOTFS: /var/lib/lockyard-ci-rootfs
          LOCKYARD_NATIVE_SANDBOX_BINARY: /usr/lib/lockyard-ci/bin/lockyard-sandbox
          LOCKYARD_NATIVE_ALLOW_REFUSAL: "1"
        run: |
          sh tests/native-executor-gate.test.sh
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          sh tools/ci/test-native-executor.sh

  node-containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable action
        with:
          toolchain: 1.99.1
      - name: Require a local runtime with CPU, memory and process limits
        shell: bash
        run: |
          set -euo pipefail
          runtime="$(command -v docker)"
          controls="$(env -u DOCKER_HOST -u DOCKER_CONTEXT -u DOCKER_TLS -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH "$runtime" --host=unix:///var/run/docker.sock info --format '{{.MemoryLimit}} {{.CPUCfsQuota}} {{.PidsLimit}}')"
          test "$controls" = 'true true true'
          echo "LOCKYARD_NODE_EXECUTOR_RUNTIME=$runtime" >> "$GITHUB_ENV"
      - name: Build the local executor fixture
        shell: bash
        run: |
          set -euo pipefail
          docker_local() {
            env -u DOCKER_HOST -u DOCKER_CONTEXT -u DOCKER_TLS -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH "$LOCKYARD_NODE_EXECUTOR_RUNTIME" --host=unix:///var/run/docker.sock "$@"
          }
          docker_local build -f tools/ci/node-executor.Dockerfile -t lockyard-node-ci:fixture tools/ci
          fixture="$(docker_local image inspect lockyard-node-ci:fixture --format '{{.Id}}')"
          echo "LOCKYARD_NODE_EXECUTOR_IMAGE=$fixture" >> "$GITHUB_ENV"
      - name: Exercise every real-container executor case
        run: cargo test --locked -p lockyard-node --test executor -- --include-ignored --test-threads=1

  packages:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test packages/npm/test/*.test.js
        shell: bash
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s packages/pypi/tests
        shell: bash
        env:
          PYTHONPATH: packages/pypi/src

  # install.sh is POSIX sh for macOS and Linux; Windows is told to use npm or cargo instead.
  installer:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sh tests/install-sh.test.sh
      - run: sh tests/check-versions.test.sh
      - name: Check the shell scripts with shellcheck
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --shell=sh install.sh scripts/check-versions.sh \
            tests/install-sh.test.sh tests/check-versions.test.sh tests/check-versions-changes.test.sh \
            examples/two-agents/run.sh

  # The two-agent example is the README's claim that Lockyard refuses a second claim; run it.
  example:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable action
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
      - run: cargo build --release -p lockyard
      - run: PATH="$PWD/target/release:$PATH" sh examples/two-agents/run.sh --check
