name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  packages:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test packages/npm/test/*.test.js
        shell: bash
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s packages/pypi/tests
        shell: bash
        env:
          PYTHONPATH: packages/pypi/src

  # install.sh is POSIX sh for macOS and Linux; Windows is told to use npm or cargo instead.
  installer:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/install-sh.test.sh
      - name: Check install.sh with shellcheck
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --shell=sh install.sh tests/install-sh.test.sh

  # The two-agent example is the README's claim that Lockyard refuses a second claim; run it.
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p lockyard
      - run: PATH="$PWD/target/release:$PATH" sh examples/two-agents/run.sh --check
