name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  npm-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test test/launcher.test.js
        working-directory: packages/npm

  # A tag that does not match the manifests would publish a version nobody can reproduce.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - shell: bash
        run: |
          set -euo pipefail
          sh tests/check-versions.test.sh
          sh scripts/check-versions.sh "${GITHUB_REF_NAME}"

  build:
    needs: [versions, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
            runner: macos-14
            wheel: macosx_11_0_arm64
          - target: x86_64-apple-darwin
            platform: darwin
            arch: x64
            runner: macos-14
            wheel: macosx_10_12_x86_64
          # Linux binaries link musl statically, so they run on any distribution.
          - target: x86_64-unknown-linux-musl
            platform: linux
            arch: x64
            runner: ubuntu-24.04
            wheel: manylinux_2_17_x86_64.musllinux_1_2_x86_64
          - target: aarch64-unknown-linux-musl
            platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            wheel: manylinux_2_17_aarch64.musllinux_1_2_aarch64
          - target: x86_64-pc-windows-msvc
            platform: win32
            arch: x64
            runner: windows-latest
            wheel: win_amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable action
        with:
          targets: ${{ matrix.target }}
      - name: Install the musl compiler
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release binary
        shell: bash
        run: cargo build --locked --release -p lockyard --target "${{ matrix.target }}"
      - name: Stage binary
        shell: bash
        run: |
          name=lockyard
          if [[ "${{ matrix.platform }}" == "win32" ]]; then name=lockyard.exe; fi
          stage="$PWD/stage/${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/$name" "$stage/$name"
          echo "LOCKYARD_BINARY=$stage/$name" >> "$GITHUB_ENV"
      # The built binary must answer before it is published; a release artifact nobody ran is a guess.
      - name: Smoke test the built binary
        if: matrix.arch == 'x64' || matrix.platform == 'darwin'
        shell: bash
        run: |
          "$LOCKYARD_BINARY" --version
          "$LOCKYARD_BINARY" about
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build platform wheel
        shell: bash
        working-directory: packages/pypi
        env:
          LOCKYARD_PLATFORM_TAG: ${{ matrix.wheel }}
        run: |
          cp ../../LICENSE ../../README.md .
          python -m pip install build
          python -m build --wheel
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.platform }}-${{ matrix.arch }}
          path: stage/${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/pypi/dist/*.whl
          if-no-files-found: error

  # install.sh downloads these assets, so the release exists before anything else is published.
  publish-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*
          path: binaries
      - uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
      - name: Pack archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            folder="binaries/binary-$target"
            [ -d "$folder" ] || { echo "missing build for $target" >&2; exit 1; }
            if [ "$target" = win32-x64 ]; then
              # Artifact download drops the executable bit, which matters for the tarballs below.
              (cd "$folder" && zip -q "$OLDPWD/assets/lockyard-$target.zip" lockyard.exe)
            else
              chmod 755 "$folder/lockyard"
              tar -czf "assets/lockyard-$target.tar.gz" -C "$folder" lockyard
            fi
          done
          (cd assets && sha256sum ./* | sed 's|\./||' > SHA256SUMS)
          cat assets/SHA256SUMS
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          file: Cargo.lock
          format: cyclonedx-json
          output-file: assets/lockyard.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Sign archives, checksums and SBOM (Sigstore keyless)
        shell: bash
        run: |
          set -euo pipefail
          # Keyless signatures via GitHub OIDC. install.sh verifies them when cosign is present.
          for asset in assets/lockyard-*.tar.gz assets/lockyard-*.zip assets/SHA256SUMS assets/lockyard.cdx.json; do
            [ -f "$asset" ] || continue
            cosign sign-blob --yes \
              --output-signature "${asset}.sig" \
              --output-certificate "${asset}.pem" \
              "$asset"
          done
      # install.sh is published with the release, so its asset names must be the ones just packed.
      - name: Check the asset names install.sh asks for
        shell: bash
        run: |
          set -euo pipefail
          sh tests/install-sh.test.sh
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            grep -q " lockyard-$target.tar.gz\$" assets/SHA256SUMS ||
              { echo "install.sh asks for lockyard-$target.tar.gz, which this release does not have" >&2; exit 1; }
          done
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md \
            assets/* install.sh

  publish-crates:
    needs: [publish-release, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable action
      - run: cargo publish --locked -p lockyard-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish --locked -p lockyard-cloud-client
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish --locked -p lockyard-node
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish --locked -p lockyard
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    needs: [publish-crates, npm-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*
          path: packages/npm/binaries
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: cp ../../LICENSE ../../README.md .
        working-directory: packages/npm
      - run: node scripts/build-platform-packages.js binaries
        working-directory: packages/npm
      # Trusted Publishing / OIDC provenance. The ./ matters: without it npm reads dist/x as a repo.
      - run: for package in ./dist/*; do npm publish "$package" --access public --provenance; done
        working-directory: packages/npm
      - run: npm publish --access public --provenance
        working-directory: packages/npm

  publish-pypi:
    needs: publish-npm
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC). Configure the GitHub environment on PyPI; no long-lived token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe2ac6f9ee81bab5 # v1.12.4
        with:
          packages-dir: dist
