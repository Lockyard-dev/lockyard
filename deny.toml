# cargo-deny configuration. CI fails the build when this policy is broken.

[graph]
all-features = true
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
yanked = "deny"
# Ignore only with a dated reason in a PR; an empty ignore list is the default.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "OpenSSL",
]
# 2026-11-08: Mozilla/CCADB trust-anchor data, not the Rust tooling license.
# https://github.com/rustls/webpki-roots#license
# Scope approval to the locked data crates; other crates/versions still fail closed.
exceptions = [
    { crate = "webpki-roots@0.26.11", allow = ["CDLA-Permissive-2.0"] },
    { crate = "webpki-roots@1.0.11", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow = []
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
